services:
  pulse:
    image: rcourtman/pulse:6.8.0
    container_name: pulse
    restart: unless-stopped
    env_file:
      - .env
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "[ -x /docker-healthcheck.sh ] && /docker-healthcheck.sh || wget --quiet --tries=1 --spider http://localhost:7655/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - pulse-data:/data
    networks:
      - mgmt
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pulse.rule=Host(`pulse.example.org`)"
      - "traefik.http.routers.pulse.entrypoints=https"
      - "traefik.http.routers.pulse.tls=true"
      - "traefik.http.routers.pulse.service=pulse"
      - "traefik.http.services.pulse.loadbalancer.server.port=7655"
      - "traefik.http.routers.pulse-agent.rule=Host(`pulse.example.org`)"
      - "traefik.http.routers.pulse-agent.entrypoints=pulse-agent"
      - "traefik.http.routers.pulse-agent.tls=true"
      - "traefik.http.routers.pulse-agent.service=pulse-agent"
      - "traefik.http.services.pulse-agent.loadbalancer.server.port=47655"

networks:
  mgmt:
    external: true

volumes:
  pulse-data:
    driver: local