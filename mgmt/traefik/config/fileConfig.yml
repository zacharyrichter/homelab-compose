http:
  middlewares:
    compress:
      compress:
        excludedContentTypes:
          - "image/jpeg"
          - "image/png"
          - "image/gif"
          - "image/webp"
          - "image/avif"
          - "video/mp4"
          - "video/webm"
          - "application/zip"
    securityHeaders:
      headers:
        customResponseHeaders:
          X-Robots-Tag: "none,noarchive,nosnippet,notranslate,noimageindex"
          server: ""
          X-Forwarded-Proto: "https"
        sslProxyHeaders:
          X-Forwarded-Proto: https
        hostsProxyHeaders:
          - "X-Forwarded-Host"
        customRequestHeaders:
          X-Forwarded-Proto: "https"
        customFrameOptionsValue: "SAMEORIGIN"
        referrerPolicy: "strict-origin-when-cross-origin"
        contentTypeNosniff: true
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsSeconds: 315360000
        stsPreload: true
    # mgmt-kasm is opened only from two admin machines: the desktop (user
    # VLAN and out-of-band port) and the laptop (user VLAN and WireGuard)
    kasm-clients:
      ipAllowList:
        sourceRange:
          - "10.0.10.99/32"
          - "10.0.99.99/32"
          - "10.0.10.14/32"
          - "10.200.0.6/32"
    authentik:
      forwardAuth:
        address: "http://authentik-outpost:9000/outpost.goauthentik.io/auth/traefik"
        trustForwardHeader: true
        # Cap what the outpost may send back (login redirects are tiny); Traefik warns without it
        maxResponseBodySize: 1048576
        authResponseHeaders:
          - "X-authentik-username"
          - "X-authentik-groups"
          - "X-authentik-email"
          - "X-authentik-name"
          - "X-authentik-uid"

  # Only for backends that serve HTTPS with a self-signed certificate
  # (wazuh dashboard, mgmt-kasm). Every other backend keeps full TLS checks.
  serversTransports:
    insecure-backend:
      insecureSkipVerify: true

  routers:
    wazuh:
      rule: "Host(`wazuh.example.org`)"
      entryPoints:
        - "https"
      middlewares:
        - "securityHeaders"
        - "compress"
      service: "wazuh"
      tls: {}

  services:
    wazuh:
      loadBalancer:
        passHostHeader: true
        serversTransport: "insecure-backend"
        servers:
          - url: "https://10.0.99.8:443"
tls:
  options:
    default:
      minVersion: VersionTLS13
      sniStrict: true