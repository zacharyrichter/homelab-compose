################################
# 🦎 KOMODO COMPOSE - MONGO 🦎 #
################################

## This compose file will deploy:
##   1. MongoDB
##   2. Komodo Core
##   3. Komodo Periphery
##
## It also creates the "mgmt" and "komodo" networks. Deploy it by hand first:
## every Komodo-managed stack on mgmt-services joins one of these networks as
## external, and Komodo Core itself needs both to start.

services:
  komodo-mongo:
    image: mongo:8.0
    container_name: komodo-mongo
    networks:
      - komodo
    labels:
      komodo.skip: # Prevent Komodo from stopping with StopAllContainers 
    command: --quiet --wiredTigerCacheSizeGB 0.25
    restart: always
    volumes:
      - /opt/appdata/komodo/mongo8-data:/data/db
      - /opt/appdata/komodo/mongo8-config:/data/configdb
    env_file:
      - path: ./.env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${KOMODO_DB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${KOMODO_DB_PASSWORD}

  core:
    image: ghcr.io/moghtech/komodo-core:2.3.4
    container_name: komodo-core
    init: true
    networks:
      - komodo
      - mgmt
    labels:
    #  komodo.skip: # Prevent Komodo from stopping with StopAllContainers
      - traefik.enable=true
      - traefik.http.routers.komodo.rule=Host(`komodo.example.org`)
      - traefik.http.routers.komodo.entrypoints=https
      - traefik.http.routers.komodo.tls=true
      - traefik.http.routers.komodo.tls.certresolver=letsencrypt
      - traefik.http.services.komodo.loadbalancer.server.port=9120
    restart: always
    depends_on:
      - komodo-mongo
   # ports:
   #   - 9120:9120
    env_file:
      - path: ./.env
    environment:
      KOMODO_DATABASE_ADDRESS: komodo-mongo:27017
      KOMODO_DATABASE_USERNAME: ${KOMODO_DB_USERNAME}
      KOMODO_DATABASE_PASSWORD: ${KOMODO_DB_PASSWORD}
      KOMODO_OIDC_ENABLED: true
    volumes:
      ## Core cache for repos for latest commit hash / contents
      - /etc/komodo/repos:/repo-cache
      ## Store sync files on server
      - /etc/komodo/syncs:/syncs
      ## Store backup files on server
      - /etc/komodo/backups:/backups
      ## Store key files on server
      - /etc/komodo/keys:/config/keys
      ## Optionally mount a custom core.config.toml
      # - /path/to/core.config.toml:/config/config.toml
    ## Allows for systemd Periphery connection at
    ## "http://host.docker.internal:8120"
    # extra_hosts:
    #   - host.docker.internal:host-gateway

  ## Deploy Periphery container using this block,
  ## or deploy the Periphery binary with systemd using
  ## https://github.com/moghtech/komodo/tree/main/scripts
  periphery:
    image: ghcr.io/moghtech/komodo-periphery:2.3.4
    container_name: komodo-periphery
    networks:
      - komodo
    labels:
      komodo.skip: # Prevent Komodo from stopping with StopAllContainers
    restart: always
    env_file:
      - path: ./.env
    volumes:
      ## Mount external docker socket
      - /var/run/docker.sock:/var/run/docker.sock
      ## Allow Periphery to see processes outside of container
      - /proc:/proc
      ## Store key files on server
      - /etc/komodo/keys:/config/keys
      ## Specify the Periphery agent root directory.
      ## Must be the same inside and outside the container,
      ## or docker will get confused. See https://github.com/moghtech/komodo/discussions/180.
      ## Default: /etc/komodo.
      - ${PERIPHERY_ROOT_DIRECTORY:-/etc/komodo}:${PERIPHERY_ROOT_DIRECTORY:-/etc/komodo}

networks:
  # Owned here (not external): this file is deployed first, by hand.
  # Subnets pinned to the values in use before the move.
  mgmt:
    name: mgmt
    ipam:
      config:
        - subnet: 172.18.0.0/16
  komodo:
    name: komodo
    ipam:
      config:
        - subnet: 172.19.0.0/16