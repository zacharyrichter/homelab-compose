services:
  code-server:
    image: "linuxserver/code-server:4.145.2"
    container_name: "code-server"
    restart: "unless-stopped"
    env_file:
      - path: "./.env"
        required: true
    volumes:
      - "/opt/appdata/code-server/config:/config"
      - "/opt/ansible-playbooks:/home/coder/ansible"
    networks:
      - "mgmt"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.code-server.rule=Host(`code.example.org`)"
      - "traefik.http.routers.code-server.tls=true"
      - "traefik.http.routers.code-server.entrypoints=https"
      - "traefik.http.services.code-server.loadbalancer.server.port=8443"
      - "traefik.http.routers.code-server.middlewares=authentik@file"

networks:
  mgmt:
    external: true