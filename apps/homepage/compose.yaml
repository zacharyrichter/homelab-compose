services:
  homepage:
    image: "ghcr.io/gethomepage/homepage:v2.8.0"
    container_name: "homepage"
    restart: "unless-stopped"
    env_file:
      - path: "./.env"
        required: true
    volumes:
      - "/opt/appdata/homepage/:/app/config/"
      - "/opt/appdata/homepage/images:/app/public/images"
    networks:
      - "warptunnel"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homepage.entryPoints=https"
      - "traefik.http.routers.homepage.rule=Host(`home.example.org`)"
      - "traefik.http.services.homepage.loadbalancer.server.port=3000"
      - "traefik.http.routers.homepage.middlewares=ipallow@file"
      - "traefik.http.routers.homepage.tls=true"

networks:
  warptunnel:
    external: true