services:
  authentik-postgresql:
    image: "docker.io/library/postgres:16-alpine"
    container_name: "authentik-postgres"
    restart: "unless-stopped"
    env_file:
      - path: "./.env"
        required: true
    volumes:
      - "/opt/appdata/authentik/database:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    networks:
      - "authentik"

  server:
    image: "ghcr.io/goauthentik/server:2026.8.5"
    container_name: "authentik-server"
    restart: "unless-stopped"
    command: server
    env_file:
      - path: "./.env"
        required: true
    volumes:
      - "/opt/appdata/authentik/data:/data"
      - "/opt/appdata/authentik/custom-templates:/templates"
    depends_on:
      authentik-postgresql:
        condition: service_healthy
    networks:
      - "authentik"
      - "warptunnel"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.authentik.entrypoints=https"
      - "traefik.http.routers.authentik.rule=Host(`auth.example.org`)"
      - "traefik.http.services.authentik.loadbalancer.server.port=9000"
      - "traefik.http.routers.authentik.middlewares=ipallow@file"
      - "traefik.http.routers.authentik.tls=true"

  worker:
    image: "ghcr.io/goauthentik/server:2026.8.5"
    container_name: "authentik-worker"
    restart: "unless-stopped"
    command: worker
    user: root
    env_file:
      - path: "./.env"
        required: true
    volumes:
      - "/opt/appdata/authentik/data:/data"
      - "/opt/appdata/authentik/certs:/certs"
      - "/opt/appdata/authentik/custom-templates:/templates"
    depends_on:
      authentik-postgresql:
        condition: service_healthy
    networks:
      - "authentik"

networks:
  warptunnel:
    external: true
  authentik:
    name: "authentik"
    ipam:
      config:
        - subnet: "172.20.0.0/16"
          gateway: "172.20.0.1"